<!DOCTYPE html>
<html lang="id" dir="ltr" data-theme="blue" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FokusKu</title>
<meta name="theme-color" content="#EEF5FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FokusKu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Terapkan tema & arah bahasa lebih awal agar tidak berkedip
  try {
    var s0 = JSON.parse(localStorage.getItem('fokusku_settings')) || {};
    var dk = s0.mode === 'dark' || ((s0.mode || 'auto') === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.mode = dk ? 'dark' : 'light';
    document.documentElement.dataset.theme = s0.theme || 'blue';
    document.documentElement.lang = s0.lang || 'id';
    document.documentElement.dir = s0.lang === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<style>
  /* ===== TEMA (variabel warna: R G B) ===== */
  :root, html[data-theme=blue][data-mode=light] { --bg:238 245 255; --card:255 255 255; --ink:27 40 66; --soft:219 234 254; --soft2:191 219 254; --accent:30 58 95; --onaccent:255 255 255; --line:226 234 245; }
  html[data-theme=blue][data-mode=dark]   { --bg:11 17 30; --card:20 30 50; --ink:226 236 250; --soft:30 45 75; --soft2:45 66 105; --accent:125 176 245; --onaccent:11 17 30; --line:36 50 80; }
  html[data-theme=green][data-mode=light] { --bg:237 249 242; --card:255 255 255; --ink:20 52 40; --soft:211 244 224; --soft2:167 232 195; --accent:22 90 66; --onaccent:255 255 255; --line:220 240 228; }
  html[data-theme=green][data-mode=dark]  { --bg:8 18 14; --card:16 30 24; --ink:220 245 232; --soft:22 50 40; --soft2:34 78 62; --accent:110 220 170; --onaccent:8 18 14; --line:28 52 42; }
  html[data-theme=purple][data-mode=light]{ --bg:245 240 255; --card:255 255 255; --ink:45 27 80; --soft:233 223 255; --soft2:213 195 253; --accent:88 51 160; --onaccent:255 255 255; --line:234 226 250; }
  html[data-theme=purple][data-mode=dark] { --bg:14 10 26; --card:26 19 46; --ink:237 230 255; --soft:42 30 74; --soft2:62 46 108; --accent:192 170 252; --onaccent:14 10 26; --line:46 34 80; }
  html[data-theme=orange][data-mode=light]{ --bg:255 244 233; --card:255 255 255; --ink:70 36 15; --soft:255 228 200; --soft2:253 205 160; --accent:164 62 20; --onaccent:255 255 255; --line:250 230 210; }
  html[data-theme=orange][data-mode=dark] { --bg:22 13 7; --card:40 25 14; --ink:255 238 222; --soft:62 38 20; --soft2:92 58 30; --accent:250 180 110; --onaccent:22 13 7; --line:70 46 28; }
  html[data-mode=dark] { color-scheme: dark; }

  /* ===== DASAR ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Plus Jakarta Sans', 'Noto Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: rgb(var(--bg)); color: rgb(var(--ink)); line-height: 1.45; min-height: 100vh; transition: background .3s, color .3s; }
  html[dir=rtl] body { font-family: 'Noto Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; font-size: 16px; color: rgb(var(--ink)); outline: none; }
  ul { list-style: none; }
  .hidden { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }
  .ico { display: inline-flex; width: 20px; height: 20px; flex-shrink: 0; }
  .ico svg { width: 100%; height: 100%; }
  .ico.sm { width: 16px; height: 16px; } .ico.lg { width: 24px; height: 24px; }
  .num { direction: ltr; unicode-bidi: isolate; display: inline-block; }

  /* ===== UTILITAS ===== */
  .row { display: flex; align-items: center; } .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; } .center { text-align: center; }
  .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; }
  .mb6 { margin-bottom: 6px; } .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; }
  .xs { font-size: 12px; } .small { font-size: 14px; } .bold { font-weight: 700; } .muted { opacity: .62; }

  /* ===== ANIMASI ===== */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  .page.enter { animation: fadeIn .3s ease both; }
  .page.enter > * { animation: rise .5s cubic-bezier(.22,.8,.3,1) both; }
  .page.enter > *:nth-child(2) { animation-delay: .05s; } .page.enter > *:nth-child(3) { animation-delay: .1s; }
  .page.enter > *:nth-child(4) { animation-delay: .15s; } .page.enter > *:nth-child(5) { animation-delay: .2s; }
  .page.enter > *:nth-child(6) { animation-delay: .25s; } .page.enter > *:nth-child(7) { animation-delay: .3s; }
  .rise { animation: rise .6s cubic-bezier(.22,.8,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ===== KOMPONEN ===== */
  .card { background: rgb(var(--card)); border: 1px solid rgb(var(--line)); border-radius: 22px; box-shadow: 0 8px 28px rgb(var(--ink) / .06); padding: 18px; margin-bottom: 14px; }
  .pt { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 6px 0 16px; }
  .pt .ico { width: 38px; height: 38px; padding: 9px; border-radius: 13px; background: rgb(var(--soft)); color: rgb(var(--accent)); }
  .h3 { font-size: 15px; font-weight: 700; }
  .lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; opacity: .8; }
  .input { display: block; width: 100%; height: 50px; padding: 0 14px; margin-bottom: 10px; border-radius: 14px; border: 1.5px solid rgb(var(--line)); background: rgb(var(--bg) / .55); transition: border-color .2s, box-shadow .2s, background .2s; }
  .input.ta { height: auto; min-height: 84px; padding: 12px 14px; resize: none; }
  .input::placeholder { color: rgb(var(--ink) / .38); }
  .input:focus { border-color: rgb(var(--accent) / .55); box-shadow: 0 0 0 4px rgb(var(--soft2) / .55); background: rgb(var(--card)); }
  input[type=tel], input[type=email], input[type=number], input[type=time] { direction: ltr; }
  html[dir=rtl] input[type=tel], html[dir=rtl] input[type=email], html[dir=rtl] input[type=number], html[dir=rtl] input[type=time] { text-align: right; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; background: rgb(var(--accent)); color: rgb(var(--onaccent)); font-weight: 700; box-shadow: 0 8px 18px rgb(var(--accent) / .28); transition: transform .15s, box-shadow .2s, opacity .2s; }
  .btn:active, .btn-soft:active, .btn-ghost:active, .btn-danger:active, .iconbtn:active, .dk:active, .tab:active, .avatar:active { transform: scale(.96); }
  .btn-soft { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 14px; background: rgb(var(--soft)); color: rgb(var(--accent)); font-weight: 700; transition: transform .15s; }
  .btn-ghost { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid rgb(var(--line)); font-weight: 600; transition: transform .15s; }
  .btn-danger { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 14px; background: rgb(239 68 68 / .1); color: #dc2626; font-weight: 700; transition: transform .15s; }
  html[data-mode=dark] .btn-danger { color: #f87171; }
  .btn-sm { width: auto; padding: 0 20px; }
  .err { color: #dc2626; font-size: 12px; margin-bottom: 10px; }
  .or { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 12px; opacity: .5; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: rgb(var(--ink) / .2); }
  .track { background: rgb(var(--soft)); border-radius: 999px; height: 10px; overflow: hidden; }
  .fill { background: rgb(var(--accent)); height: 100%; border-radius: 999px; width: 0; transition: width .6s cubic-bezier(.22,.8,.3,1); }
  .chip { font-size: 12px; font-weight: 600; background: rgb(var(--soft)); color: rgb(var(--accent)); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }

  /* ===== LOGIN ===== */
  .login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; position: relative; }
  .login-lang { position: absolute; top: calc(16px + env(safe-area-inset-top)); inset-inline-end: 16px; display: flex; gap: 4px; background: rgb(var(--card)); border: 1px solid rgb(var(--line)); border-radius: 999px; padding: 4px; }
  .login-lang button { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; opacity: .7; transition: .2s; }
  .login-lang button.on { background: rgb(var(--accent)); color: rgb(var(--onaccent)); opacity: 1; }
  .login-box { width: 100%; max-width: 380px; text-align: center; }
  .logo { display: inline-block; filter: drop-shadow(0 10px 18px rgb(var(--accent) / .3)); margin-bottom: 14px; }
  .brand { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
  .tagline { font-size: 14px; opacity: .65; margin: 4px 0 14px; }
  .quote { font-size: 13px; font-style: italic; color: rgb(var(--accent)); background: rgb(var(--soft)); padding: 10px 14px; border-radius: 14px; margin-bottom: 18px; }
  .login-card { text-align: start; margin: 0; padding: 22px; }

  /* ===== HEADER & NAV ===== */
  #screen-dash { padding-bottom: 130px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: 14px; }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .who .sub { font-size: 12px; opacity: .6; }
  .who h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 46px; height: 46px; border-radius: 16px; background: rgb(var(--accent)); color: rgb(var(--onaccent)); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex-shrink: 0; transition: transform .15s, box-shadow .2s; }
  .avatar.on { box-shadow: 0 0 0 3px rgb(var(--bg)), 0 0 0 5px rgb(var(--accent)); }
  .avatar.xl { width: 84px; height: 84px; border-radius: 28px; font-size: 34px; margin: 0 auto 12px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 15px; background: rgb(var(--card)); border: 1px solid rgb(var(--line)); display: grid; place-items: center; color: rgb(var(--ink) / .75); box-shadow: 0 4px 12px rgb(var(--ink) / .05); transition: transform .15s, background .2s; }
  .iconbtn.on { background: rgb(var(--soft)); color: rgb(var(--accent)); }
  .dock { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; display: flex; justify-content: center; padding: 0 14px; pointer-events: none; }
  .dock-in { pointer-events: auto; width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 24px; background: rgb(var(--card) / .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgb(var(--line)); box-shadow: 0 12px 36px rgb(var(--ink) / .14); }
  .dk { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px; border-radius: 18px; font-size: 11px; font-weight: 600; color: rgb(var(--ink) / .5); transition: background .25s, color .25s, transform .15s; }
  .dk.on { background: rgb(var(--soft)); color: rgb(var(--accent)); }

  /* ===== DAFTAR ===== */
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgb(var(--bg) / .7); margin-bottom: 8px; }
  .item .t { font-size: 14px; font-weight: 600; word-break: break-word; }
  .item .s { font-size: 12px; opacity: .6; }
  .empty { font-size: 14px; opacity: .5; text-align: center; padding: 14px 0; }
  .x { opacity: .35; padding: 4px; display: grid; place-items: center; }
  .x:active { opacity: .8; }
  .done-text { text-decoration: line-through; opacity: .45; }
  .rate { color: #F5B83D; font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .rate i { font-style: normal; opacity: .25; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .prio-high { background: #fee2e2; color: #b91c1c; } .prio-med { background: #fef3c7; color: #a16207; } .prio-low { background: #dcfce7; color: #15803d; }
  html[data-mode=dark] .prio-high { background: #7f1d1d; color: #fecaca; }
  html[data-mode=dark] .prio-med { background: #713f12; color: #fde68a; }
  html[data-mode=dark] .prio-low { background: #14532d; color: #bbf7d0; }
  .c-in { color: #15803d; } .c-out { color: #dc2626; }
  html[data-mode=dark] .c-in { color: #4ade80; } html[data-mode=dark] .c-out { color: #f87171; }
  .bar-in { background: #22c55e; } .bar-out { background: #ef4444; }
  .chk-box { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgb(var(--soft2)); flex-shrink: 0; position: relative; transition: .2s; background: transparent; cursor: pointer; }
  .chk-box:checked { background: rgb(var(--accent)); border-color: rgb(var(--accent)); }
  .chk-box:checked::after { content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid rgb(var(--onaccent)); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .chk-row { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .star { width: 32px; height: 32px; fill: none; stroke: rgb(var(--soft2)); stroke-width: 1.6; stroke-linejoin: round; transition: transform .15s, fill .2s; }
  .star.on { fill: #F5B83D; stroke: #F5B83D; }
  .stars button:active .star { transform: scale(1.2); }

  /* ===== TILE & HERO ===== */
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tile { background: rgb(var(--card)); border: 1px solid rgb(var(--line)); border-radius: 18px; padding: 12px 6px; text-align: center; box-shadow: 0 6px 18px rgb(var(--ink) / .05); }
  .tile.dark { background: rgb(var(--accent)); color: rgb(var(--onaccent)); border-color: transparent; }
  .tile .k { font-size: 11px; opacity: .65; } .tile .v { font-size: 14px; font-weight: 800; margin-top: 2px; }
  .hero { text-align: center; background: linear-gradient(160deg, rgb(var(--soft)), rgb(var(--soft2) / .6)); }
  .hero .big { font-size: 56px; font-weight: 800; line-height: 1; margin: 8px 0 4px; display: flex; align-items: center; justify-content: center; gap: 8px; color: rgb(var(--accent)); }
  .hero .big .ico { width: 44px; height: 44px; color: #f97316; }

  /* ===== KOSAKATA ===== */
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tab { flex: 1; height: 42px; border-radius: 13px; font-size: 14px; font-weight: 600; background: rgb(var(--bg) / .7); border: 1.5px solid rgb(var(--line)); transition: .2s; }
  .tab.on { background: rgb(var(--accent)); color: rgb(var(--onaccent)); border-color: transparent; }
  .flip-wrap { perspective: 1000px; margin-bottom: 14px; }
  .flip-card { position: relative; width: 100%; height: 240px; transition: transform .6s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; cursor: pointer; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; box-shadow: 0 14px 34px rgb(var(--ink) / .14); }
  .face.front { background: rgb(var(--accent)); color: rgb(var(--onaccent)); }
  .face.back { background: rgb(var(--card)); border: 1px solid rgb(var(--line)); transform: rotateY(180deg); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ===== GRAFIK ===== */
  .chart { display: flex; gap: 8px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .barwrap, .pair { height: 112px; width: 100%; display: flex; justify-content: center; }
  .barwrap { flex-direction: column; justify-content: flex-end; align-items: center; }
  .pair { align-items: flex-end; gap: 3px; }
  .bar { width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: rgb(var(--accent)); transition: height .6s; }
  .bar.dim { opacity: .45; }
  .b2 { width: 10px; border-radius: 5px 5px 2px 2px; }
  .val { font-size: 10px; margin-bottom: 3px; font-weight: 600; }
  .lab { font-size: 10px; margin-top: 6px; opacity: .6; } .lab.today { font-weight: 800; opacity: 1; color: rgb(var(--accent)); }
  .hdot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--soft)); color: rgb(var(--ink) / .3); }
  .hdot.ok { background: rgb(var(--accent)); color: rgb(var(--onaccent)); }
  .legend { display: flex; gap: 10px; font-size: 11px; }
  .dotlg { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge { background: rgb(var(--bg) / .7); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .badge .bic { width: 42px; height: 42px; border-radius: 14px; margin: 0 auto 6px; display: grid; place-items: center; background: rgb(var(--accent)); color: rgb(var(--onaccent)); }
  .badge .n { font-size: 11px; font-weight: 700; line-height: 1.25; } .badge .d { font-size: 10px; opacity: .6; line-height: 1.25; margin-top: 2px; }
  .badge.lock { opacity: .4; } .badge.lock .bic { background: rgb(var(--soft2)); color: rgb(var(--ink) / .5); }

  /* ===== PROFIL & PENGATURAN ===== */
  .prof-hero { text-align: center; }
  .prof-hero h2 { font-size: 20px; font-weight: 800; }
  .prof-hero .sub { font-size: 13px; opacity: .6; margin-bottom: 14px; }
  .prof-hero .track { height: 6px; margin: 0 auto 6px; max-width: 220px; }
  .info { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgb(var(--line)); }
  .info:last-child { border-bottom: 0; margin-bottom: 4px; }
  .info .ico { width: 36px; height: 36px; padding: 9px; border-radius: 12px; background: rgb(var(--soft)); color: rgb(var(--accent)); }
  .info .k { font-size: 11px; opacity: .55; } .info .v { font-size: 14px; font-weight: 600; word-break: break-word; }
  .info .ph { opacity: .4; font-weight: 500; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 14px; margin-bottom: 14px; cursor: pointer; }
  .switch { -webkit-appearance: none; appearance: none; width: 46px; height: 28px; border-radius: 999px; background: rgb(var(--soft2)); position: relative; flex-shrink: 0; transition: .25s; cursor: pointer; }
  .switch::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .2); transition: .25s; }
  .switch:checked { background: rgb(var(--accent)); }
  .switch:checked::after { inset-inline-start: 21px; }
  .segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .seg { height: 44px; border-radius: 13px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgb(var(--bg) / .7); border: 1.5px solid rgb(var(--line)); transition: .2s; }
  .seg.on { background: rgb(var(--accent)); color: rgb(var(--onaccent)); border-color: transparent; }
  .themes { display: flex; gap: 18px; margin-bottom: 4px; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 44px; height: 44px; border-radius: 50%; display: block; border: 3px solid transparent; box-shadow: 0 4px 10px rgb(0 0 0 / .18); transition: .2s; }
  .dot.sel { border-color: rgb(var(--card)); box-shadow: 0 0 0 3px rgb(var(--accent)); }

  /* ===== TOAST & MODAL ===== */
  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 70; background: rgb(var(--accent)); color: rgb(var(--onaccent)); font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 14px; box-shadow: 0 10px 28px rgb(0 0 0 / .22); max-width: 90%; text-align: center; animation: rise .3s both; }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgb(15 23 42 / .45); display: flex; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadeIn .2s; }
  .modal-card { background: rgb(var(--card)); border-radius: 24px; padding: 22px; width: 100%; max-width: 340px; box-shadow: 0 24px 60px rgb(0 0 0 / .3); animation: pop .28s cubic-bezier(.2,1.2,.4,1); }
  .modal-card h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), 3200);
}
function askConfirm(msg, yesKey, cb) {
  $('mMsg').textContent = msg; $('mYes').textContent = t(yesKey || 'yes');
  $('modal').classList.remove('hidden');
  const close = () => { $('modal').classList.add('hidden'); $('mYes').onclick = null; $('mNo').onclick = null; };
  $('mNo').onclick = close; $('mYes').onclick = () => { close(); cb(); };

}

/* ================= GOOGLE SHEETS ================= */
const sheetReady = () => WEB_APP_URL && !WEB_APP_URL.startsWith('GANTI_');
const uname = () => session ? (session.guest ? 'guest' : session.name) : '';
async function sendToGoogleSheet(data) {
  if (!sheetReady()) { console.warn('WEB_APP_URL belum diisi. Data hanya tersimpan lokal.'); return false; }
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script tidak mengirim header CORS; request tetap terkirim
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...data, user: uname(), timestamp: new Date().toISOString() })
    });
    return true;
  } catch (err) {
    console.error('Gagal kirim ke Google Sheet:', err);
    toast(t('syncFail'));
    return false;
  }
}

function applyTheme() {
  const dark = settings.mode === 'dark' || (settings.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  document.documentElement.dataset.theme = settings.theme;
  const c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().split(/\s+/).join(',');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta && c) meta.content = 'rgb(' + c + ')';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (settings.mode === 'auto') applyTheme(); });

function checkBadges(silent) {
  const s = stats(), fresh = [];

  if (fresh.length) {
    save('badges', earned);
    if (!silent) {
      toast(t('newBadge', { n: fresh.map(b => tl(b.n)).join(', ') }));

const hname = h => h.k ? t(h.k) : h.name;
function isDayDone(k) { return habits.length > 0 && habits.every(h => (habitLog[k] || []).includes(h.id)); }
function calcStreak() {
  const d = new Date(); let n = 0;
  if (!isDayDone(dateKey(d))) d.setDate(d.getDate() - 1);
  while (isDayDone(dateKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderHabits() {
  const k = dateKey(new Date()), done = habitLog[k] || [];
  $('habitList').innerHTML = habits.map(h => `
    <li class="item">
      <label class="chk-row"><input type="checkbox" class="chk-box" data-h="${h.id}" ${done.includes(h.id) ? 'checked' : ''}>
      <span class="t ${done.includes(h.id) ? 'done-text' : ''}">${esc(hname(h))}</span></label>
      <button data-del="${h.id}" class="x">${ic('x', 'sm')}</button>
    </li>`).join('') || `<li class="empty">${t('noHabits')}</li>`;
  $('streakNum').textContent = calcStreak();
  $('habitProgress').textContent = t('habitProg', { a: done.filter(id => habits.some(h => h.id === id)).length, b: habits.length });
  $('habitList').querySelectorAll('input').forEach(c => c.addEventListener('change', () => {
    const arr = habitLog[k] || [];
    habitLog[k] = c.checked ? [...new Set([...arr, c.dataset.h])] : arr.filter(x => x !== c.dataset.h);
    save('habitLog', habitLog);
    const hb = habits.find(h => h.id === c.dataset.h);
    sendToGoogleSheet({ type: 'habit', habit: hb.k ? T[hb.k][0] : hb.name, checked: c.checked, streak: calcStreak() });
    renderHabits();
    if (isDayDone(k)) toast(t('allDone'));
    setTimeout(() => checkBadges(false), 400);
  }));
  $('habitList').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    askConfirm(t('delHabit'), 'delete', () => { habits = habits.filter(h => h.id !== b.dataset.del); save('habits', habits); renderHabits(); });
  }));
}

const prioOrder = { high: 0, med: 1, low: 2 };

$('btnTask').addEventListener('click', () => {

  const x = { id: uid(), text, prio: $('taskPrio').value, time: $('taskTime').value, done: false, notified: false };
  tasks.push(x); save('tasks', tasks);
  sendToGoogleSheet({ type: 'tugas', text: x.text, prioritas: prioSheet[x.prio], jam: x.time || '-', selesai: false });
  $('taskText').value = ''; $('taskTime').value = '';
  renderTasks(); toast(t('taskAdded'));

function renderTasks() {
  const sorted = [...tasks].sort((a, b) => a.done - b.done || prioOrder[a.prio] - prioOrder[b.prio] || (a.time || '99').localeCompare(b.time || '99'));
  $('taskList').innerHTML = sorted.map(x => `
    <li class="item">
      <input type="checkbox" class="chk-box" data-t="${x.id}" ${x.done ? 'checked' : ''}>
      <div class="grow ${x.done ? 'done-text' : ''}">
        <p class="t">${esc(x.text)}</p>
        <p class="xs" style="margin-top:4px"><span class="pill prio-${x.prio}">${t(prioKey[x.prio])}</span>${x.time ? ' &nbsp;<span class="num muted">' + x.time + '</span>' : ''}</p>
      </div>
      <button data-del="${x.id}" class="x">${ic('x', 'sm')}</button>
    </li>`).join('') || `<li class="empty">${t('noTasks')}</li>`;
  $('taskList').querySelectorAll('input').forEach(c => c.addEventListener('change', () => {
    const x = tasks.find(y => y.id === c.dataset.t); x.done = c.checked; save('tasks', tasks);
    sendToGoogleSheet({ type: 'tugas', text: x.text, prioritas: prioSheet[x.prio], jam: x.time || '-', selesai: x.done });
    renderTasks(); setTimeout(() => checkBadges(false), 400);
  }));
  $('taskList').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    tasks = tasks.filter(y => y.id !== b.dataset.del); save('tasks', tasks); renderTasks();
  }));
}

  $('vocabCounter').textContent = t('cardCount', { i: vocabIdx + 1, n: list.length, k: known }) + (st ? ' • ' + (st === 'hafal' ? '✔ ' + t('stKnown') : '↻ ' + t('stRepeat')) : '');

$('flipCard').addEventListener('click', () => $('flipCard').classList.toggle('flipped'));
function markVocab(status) {
  const c = VOCAB[curLang][vocabIdx];
  vocabStatus[curLang + '_' + vocabIdx] = status; save('vocabStatus', vocabStatus);
  sendToGoogleSheet({ type: 'kosakata', bahasa: T[LANGKEY[curLang]][0], kata: c.w, arti: c.m[0] || c.m[1], status: status === 'hafal' ? 'Sudah Hafal' : 'Perlu Ulangi' });
  vocabIdx = (vocabIdx + 1) % VOCAB[curLang].length;
  renderCard(); setTimeout(() => checkBadges(false), 400);
}
$('btnKnown').addEventListener('click', () => markVocab('hafal'));
$('btnRepeat').addEventListener('click', () => markVocab('ulangi'));

/* ================= 6. STATISTIK ================= */
function lastDays(n) { const a = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); a.push(d); } return a; }
function renderStats() {
  const days = lastDays(7), todayK = dateKey(new Date()), DN = DAYS[LIDX[settings.lang]];
  const mins = days.map(d => minutesOn(dateKey(d)));
  const maxM = Math.max(...mins, settings.target, 1), H = 88;
  const week = mins.reduce((a, b) => a + b, 0);
  $('stWeekMin').textContent = week + ' ' + t('minShort');
  $('stAvgMin').textContent = Math.round(week / 7) + ' ' + t('minShort');
  $('stTargetNote').textContent = t('targetNote', { n: settings.target });
  $('chartStudy').innerHTML = days.map((d, i) => {
    const hit = mins[i] >= settings.target;
    return `<div class="col"><div class="barwrap"><span class="val num">${mins[i] || ''}${hit ? '✔' : ''}</span>
      <div class="bar ${hit ? '' : 'dim'}" style="height:${mins[i] ? Math.max(4, Math.round(mins[i] / maxM * H)) : 2}px"></div></div>
      <span class="lab ${dateKey(d) === todayK ? 'today' : ''}">${DN[d.getDay()]}</span></div>`;
  }).join('');
  const fin = days.map(d => {
    const k = dateKey(d), day = finances.filter(f => dateKey(new Date(f.date)) === k);
    return { i: day.filter(f => f.type === 'in').reduce((a, f) => a + f.amount, 0), o: day.filter(f => f.type === 'out').reduce((a, f) => a + f.amount, 0) };
  });
  const maxF = Math.max(...fin.map(f => Math.max(f.i, f.o)), 1);
  $('stNet').textContent = rp(fin.reduce((a, f) => a + f.i - f.o, 0));
  $('chartMoney').innerHTML = days.map((d, i) => `
    <div class="col"><div class="pair" title="${rp(fin[i].i)} / ${rp(fin[i].o)}">
      <div class="b2 bar-in" style="height:${fin[i].i ? Math.max(4, Math.round(fin[i].i / maxF * 100)) : 2}px"></div>
      <div class="b2 bar-out" style="height:${fin[i].o ? Math.max(4, Math.round(fin[i].o / maxF * 100)) : 2}px"></div></div>
      <span class="lab ${dateKey(d) === todayK ? 'today' : ''}">${DN[d.getDay()]}</span></div>`).join('');
  $('habitWeek').innerHTML = days.map(d => {
    const ok = isDayDone(dateKey(d));
    return `<div class="col" style="gap:6px"><span class="hdot ${ok ? 'ok' : ''}">${ok ? ic('check', 'sm') : '·'}</span>
      <span class="lab ${dateKey(d) === todayK ? 'today' : ''}" style="margin:0">${DN[d.getDay()]}</span></div>`;
  }).join('');
  $('badgeCount').textContent = t('unlocked', { a: BADGES.filter(b => earned[b.id]).length, b: BADGES.length });
  $('badgeGrid').innerHTML = BADGES.map(b => `
    <div class="badge ${earned[b.id] ? '' : 'lock'}"><div class="bic">${ic(b.i)}</div><p class="n">${tl(b.n)}</p><p class="d">${tl(b.d)}</p></div>`).join('');
}

/* ================= INIT ================= */
function renderAll() {
  updateHeader(); renderStars(); renderStudy(); renderHabits(); renderFinance(); renderTasks();
  renderLangTabs(); renderCard(); renderSettings(); renderProfile(); renderStats();
}
applyTheme();
applyLang();
if (session) showDashboard(); else showLogin();
</script>

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var name = data.type || 'lainnya';
    var sheet = ss.getSheetByName(name);
    if (!sheet) {
      sheet = ss.insertSheet(name);
      sheet.appendRow(Object.keys(data));
    }
    var headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    var row = headers.map(function (h) { return data[h] !== undefined ? data[h] : ''; });

    // Profil: perbarui baris yang sudah ada untuk pengguna yang sama
    if (name === 'profil') {
      var uIdx = headers.indexOf('user');
      var last = sheet.getLastRow();
      if (uIdx > -1 && last > 1) {
        var users = sheet.getRange(2, uIdx + 1, last - 1, 1).getValues();
        for (var i = 0; i < users.length; i++) {
          if (users[i][0] === data.user) {
            sheet.getRange(i + 2, 1, 1, row.length).setValues([row]);
            return out({ status: 'ok', updated: true });
          }
        }
      }
    }
    sheet.appendRow(row);
    return out({ status: 'ok' });
  } catch (err) {
    return out({ status: 'error', message: String(err) });
  }
}

const CACHE = 'fokusku-v4';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.add('./')).catch(() => {}));
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys()
      .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request)
      .then(res => { const copy = res.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); return res; })
      .catch(() => caches.match(e.request).then(r => r || caches.match('./')))
  );
});
